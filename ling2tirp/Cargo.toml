[package]
name = "ling2tirp"
version = "0.1.0"
edition = "2024"
description = "Import Ling deposited genomic/barcode/genomic FASTQ triplets as sorted Bascet BBGZ TIRP"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
csv = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
