[package]
name = "sag2tirp"
version = "0.1.0"
edition = "2024"
description = "Convert per-cell SAG FASTA assemblies to sorted Bascet TIRP"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
noodles = { version = "0.97", features = ["bgzf", "core", "csi", "tabix"] }
tempfile = "3"
zip = { version = "4.3", default-features = false, features = ["deflate-flate2"] }
