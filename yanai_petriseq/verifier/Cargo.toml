[package]
name = "verify-yanai-debarcoding"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent streaming PETRI-seq decoder and complete TIRP multiset audit"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
serde_json = "1"
sha2 = "0.10"
